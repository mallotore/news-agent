# news-agent configuration
#
# Feed URLs verified on 2026-11-01. Re-run `uv run news-agent --check-feeds` to re-check.

language: es            # output language of the digest (es, en, fr, ...)
model: haiku         # alias passed to `claude --model` (haiku = fast and cheap, sonnet = better prose)
lookback_hours: 72     # only consider items published in the last N hours
max_items_per_topic: 10  # rows per topic table
max_candidates_per_topic: 60  # items sent to the LLM per topic (cost control)
max_items_per_feed: 4 # cap per feed so one noisy source cannot crowd out the rest
output_dir: news        # relative to this file; digests are written as YYYY-MM-DD.md

