[project]
name = "news-agent"
version = "0.1.0"
description = "Daily news digest from official feeds, summarized by an LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# This is an application, not an installable package: run it with `uv run python -m news_agent`.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
